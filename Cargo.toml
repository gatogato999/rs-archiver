[package]
name = "rs-archiver"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
dotenvy = "0.15.7"
mail-parser = "0.11.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pop3-mail-client = "0.1.0"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
