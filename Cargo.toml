[package]
name = "rs-archiver"
version = "0.1.0"
edition = "2024"

[dependencies]
async-native-tls = "0.5.0"
async-pop = "1.1.3"
base64 = "0.23.1"
dotenvy = "0.15.7"
mail-parser = "0.11.9"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
