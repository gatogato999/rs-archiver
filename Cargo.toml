[package]
name = "rs-archiver"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
mail-parser = "0.11.9"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
